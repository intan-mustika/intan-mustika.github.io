<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Portfolio</title>
    
    <!-- Swiper.js CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* Modern Reset & Fullscreen Viewport */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Disable scrollbars */
            background-color: #0d0d0d; /* Pure dark charcoal/black */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Swiper Viewport Container */
        .swiper {
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
        }

        .swiper-slide {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        /* Fullscreen Image Presentation */
        .swiper-slide img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Preserves exact aspect ratio without clipping drawings */
            display: block;
        }

        /* Minimalist Navigation Arrows */
        .swiper-button-next,
        .swiper-button-prev {
            color: #ffffff !important;
            width: 60px !important;
            height: 60px !important;
            opacity: 0.2;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Enlarge arrow icons slightly */
        .swiper-button-next::after,
        .swiper-button-prev::after {
            font-size: 22px !important;
            font-weight: 300;
        }

        .swiper-button-next:hover,
        .swiper-button-prev:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        /* Hide buttons slightly on small touch screens if desired, but keep accessible */
        @media (max-width: 768px) {
            .swiper-button-next,
            .swiper-button-prev {
                width: 44px !important;
                height: 44px !important;
                opacity: 0.3;
            }

            .swiper-button-next::after,
            .swiper-button-prev::after {
                font-size: 18px !important;
            }
        }
    </style>
</head>
<body>

    <!-- Swiper Container -->
    <div class="swiper">
        <div class="swiper-wrapper">
            
            <!-- ======================================================================= -->
            <!-- ADD / REPLACE YOUR PORTFOLIO PAGES HERE                                 -->
            <!-- Duplicate or remove <div class="swiper-slide"> blocks as needed.        -->
            <!-- ======================================================================= -->

            <!-- Page 1 -->
            <div class="swiper-slide">
                <img src="portfolio_pages/page-1.jpg" alt="Architectural Portfolio Page 1" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/1a1a1a/888888?text=portfolio_pages/page-1.jpg';">
            </div>

            <!-- Page 2 -->
            <div class="swiper-slide">
                <img src="portfolio_pages/page-2.jpg" alt="Architectural Portfolio Page 2" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/1a1a1a/888888?text=portfolio_pages/page-2.jpg';">
            </div>

            <!-- Page 3 -->
            <div class="swiper-slide">
                <img src="portfolio_pages/page-3.jpg" alt="Architectural Portfolio Page 3" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/1a1a1a/888888?text=portfolio_pages/page-3.jpg';">
            </div>

            <!-- Page 4 -->
            <div class="swiper-slide">
                <img src="portfolio_pages/page-4.jpg" alt="Architectural Portfolio Page 4" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/1a1a1a/888888?text=portfolio_pages/page-4.jpg';">
            </div>

            <!-- Page 5 -->
            <div class="swiper-slide">
                <img src="portfolio_pages/page-5.jpg" alt="Architectural Portfolio Page 5" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/1a1a1a/888888?text=portfolio_pages/page-5.jpg';">
            </div>

            <!-- ======================================================================= -->

        </div>

        <!-- Left / Right Navigation Controls -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>

    <!-- Swiper.js JavaScript (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Slider Initialization -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const swiper = new Swiper('.swiper', {
                // Smooth transition speed
                speed: 400,
                
                // Infinite looping disabled for standard document reading order
                loop: false,

                // Touch and drag support
                grabCursor: true,

                // Keyboard Arrow Navigation
                keyboard: {
                    enabled: true,
                    onlyInViewport: true,
                },

                // Mousewheel scrolling navigation
                mousewheel: {
                    thresholdDelta: 50,
                    sensitivity: 1,
                },

                // Minimal Edge Navigation Arrows
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },

                // Fade transition for ultra-clean architectural presentation
                effect: 'fade',
                fadeEffect: {
                    crossFade: true
                }
            });
        });
    </script>
</body>
</html>
